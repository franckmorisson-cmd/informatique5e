<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission numérique — 5e</title><style>:root{font-family:Arial,sans-serif;color:#18243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:22px}header{background:#172c50;color:white;padding:22px;border-radius:16px}h1{margin:0 0 8px;font-size:28px}h2{margin-top:0}.sub{opacity:.9}.panel{background:white;border-radius:16px;padding:24px;margin-top:16px;box-shadow:0 3px 18px #152d4a12}.progress{height:12px;background:#dce5f1;border-radius:20px;overflow:hidden;margin-top:16px}.bar{height:100%;background:#16826b;transition:width .2s}.tag{color:#315c9b;font-weight:bold}.task{padding:14px;background:#eef4ff;border-left:4px solid #3165b5;border-radius:8px;line-height:1.55}.answers{display:grid;gap:9px;margin:16px 0}.answers label{padding:12px;border:1px solid #ccd7e5;border-radius:9px;cursor:pointer}.answers label:has(input:checked){border-color:#225bb2;background:#edf4ff}button{background:#215bb1;color:white;border:0;border-radius:9px;padding:12px 17px;font-size:16px;cursor:pointer;margin:5px 7px 5px 0}button.secondary{background:#e8edf5;color:#233958}button:disabled{opacity:.45;cursor:not-allowed}.feedback{padding:12px;border-radius:9px;margin-top:12px}.ok{background:#e2f5eb;color:#135a3c}.bad{background:#fff0e9;color:#8c3b17}.muted{color:#59697f}.small{font-size:14px}.hidden{display:none}textarea,input[type=text]{width:100%;padding:11px;border:1px solid #abb9cb;border-radius:8px;font:inherit}textarea{min-height:90px}.check{display:block;margin:12px 0}footer{text-align:center;color:#59697f;padding:25px}#missions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}#missions span{font-size:12px;padding:7px 9px;border-radius:30px;background:#e4eaf3}#missions span.active{background:#c9e9df;font-weight:bold}@media(max-width:600px){.wrap{padding:10px}.panel{padding:17px}h1{font-size:23px}}</style></head><body><div class="wrap"><header><h1>Mission numérique — Classe de 5e</h1><div class="sub">6 missions · 50 minutes · À réaliser individuellement et à son rythme</div><div class="progress" aria-label="Progression"><div class="bar" id="bar"></div></div><div id="missions"></div></header><main class="panel" id="app" aria-live="polite"></main><footer>Travail enregistré uniquement dans ce navigateur. Aucun nom ni résultat n'est envoyé sur Internet.</footer></div><script>
const tasks=[
{title:'1. Organiser ses fichiers',time:'8 min',skill:'Gestion des fichiers',instruction:'Ouvrir le gestionnaire de fichiers. Dans votre espace personnel, créer un dossier nommé « Informatique_5e ». À l’intérieur, créer un sous-dossier nommé « Documents ». Revenir ensuite sur cette page.',hint:'Sur Windows : ouvrir l’Explorateur de fichiers (icône de dossier jaune). Dans votre espace personnel, clic droit → Nouveau → Dossier. Sur Linux, ouvrir le gestionnaire de fichiers et choisir « Nouveau dossier ».',q:'Quel nom correspond au sous-dossier demandé ?',options:['Documents','Téléchargements','Images'],answer:0,explain:'Le sous-dossier demandé est « Documents ».',proof:'J’ai créé les deux dossiers dans mon espace personnel.'},
{title:'2. Naviguer efficacement',time:'7 min',skill:'Navigation web',instruction:'Ouvrir un nouvel onglet dans le navigateur avec Ctrl + T. Saisir « service-public.fr » dans la barre d’adresse, puis revenir à cette page sans fermer le nouvel onglet.',hint:'Ctrl + T ouvre un onglet. Pour passer d’un onglet à l’autre, cliquer sur leurs titres en haut du navigateur.',q:'Que fait le raccourci Ctrl + T dans un navigateur ?',options:['Il ferme le navigateur','Il ouvre un nouvel onglet','Il imprime la page'],answer:1,explain:'Ctrl + T ouvre un nouvel onglet.',proof:'J’ai ouvert un deuxième onglet et suis revenu ici.'},
{title:'3. Chercher et vérifier',time:'8 min',skill:'Recherche d’information',instruction:'Dans un autre onglet, rechercher le site officiel de la Bibliothèque nationale de France (BnF). Repérer l’adresse du site, puis revenir ici.',hint:'Utiliser les mots-clés « Bibliothèque nationale de France site officiel ». Vérifier le nom de l’organisme et l’adresse du site, sans se fier uniquement au premier résultat.',q:'Quelle adresse correspond au site officiel de la Bibliothèque nationale de France ?',options:['bnf.fr','bnf-gratuit-exemple.com','bibliotheque-france-promo.net'],answer:0,explain:'Le site institutionnel officiel utilise le domaine bnf.fr.',proof:'J’ai effectué la recherche et vérifié l’adresse du site.'},
{title:'4. Produire un document',time:'12 min',skill:'Traitement de texte',instruction:'Ouvrir LibreOffice Writer (ou Word). Écrire le titre « Mes 3 conseils numériques ». Ajouter trois conseils : protéger son mot de passe, vérifier une information et respecter les autres. Mettre le titre en gras et en couleur. Enregistrer le document dans le dossier « Documents » créé à la mission 1, sous le nom « Conseils_numeriques ».',hint:'Pour mettre en gras : sélectionner le titre puis Ctrl + B. Pour enregistrer : Ctrl + S, puis choisir le dossier « Informatique_5e / Documents ».',q:'Quel raccourci sert généralement à enregistrer un document ?',options:['Ctrl + P','Ctrl + S','Ctrl + Z'],answer:1,explain:'Ctrl + S enregistre le document.',proof:'Mon document contient un titre et trois conseils ; je l’ai enregistré au bon endroit.'},
{title:'5. Se protéger en ligne',time:'7 min',skill:'Sécurité numérique',instruction:'Lire la situation : « Un message annonce que votre compte sera supprimé dans 10 minutes et demande votre mot de passe via un lien. » Réfléchir à la réaction la plus sûre.',hint:'Les messages urgents demandant un mot de passe sont souvent des tentatives d’hameçonnage. Passer par le site officiel sans cliquer sur le lien.',q:'Que faut-il faire dans cette situation ?',options:['Cliquer vite sur le lien','Envoyer son mot de passe','Ne pas cliquer et vérifier via le site officiel'],answer:2,explain:'Il ne faut jamais communiquer son mot de passe à partir d’un lien reçu dans un message.',proof:'J’ai compris pourquoi ce message est suspect.'},
{title:'6. Défi final',time:'8 min',skill:'Autonomie et réinvestissement',instruction:'Retrouver le fichier « Conseils_numeriques » dans « Informatique_5e / Documents ». L’ouvrir, ajouter à la fin la phrase « Je vérifie toujours mes sources. », puis enregistrer de nouveau. Revenir ici pour terminer.',hint:'Ouvrir le gestionnaire de fichiers, entrer dans « Informatique_5e », puis « Documents ». Double-cliquer sur le document, ajouter la phrase, puis Ctrl + S.',q:'Pour modifier un fichier déjà enregistré, quelle méthode convient ?',options:['Le retrouver, l’ouvrir, le modifier, l’enregistrer','Le supprimer et tout recommencer','Renommer le dossier sans ouvrir le fichier'],answer:0,explain:'On ouvre le document existant, on le modifie, puis on enregistre.',proof:'J’ai retrouvé, modifié et enregistré mon document.'}
];
const KEY='mission_numerique_5e_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||typeof state.step!=='number'||state.step<0||state.step>6)state={step:0,done:[],attempts:Array(6).fill(0)};function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function el(id){return document.getElementById(id)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){el('bar').style.width=Math.round(state.done.length/6*100)+'%';el('missions').innerHTML=tasks.map((t,i)=>`<span class="${i===state.step?'active':''}">${state.done.includes(i)?'✓ ':''}Mission ${i+1}</span>`).join('');if(state.step===6){el('app').innerHTML=`<h2>Parcours terminé !</h2><p class="feedback ok">Bravo, les 6 missions ont été validées.</p><p>Vous avez travaillé : les fichiers, la navigation, la recherche, le traitement de texte et la sécurité numérique.</p><p><strong>Vérification finale :</strong> le document « Conseils_numeriques » est-il bien enregistré dans votre dossier ?</p><button id="report">Télécharger mon bilan</button><button class="secondary" id="reset">Recommencer</button><p class="muted small">Le bilan ne prouve pas automatiquement les manipulations réalisées : celles-ci ont été déclarées par l’élève.</p>`;el('report').onclick=download;el('reset').onclick=reset;return}let t=tasks[state.step];el('app').innerHTML=`<p class="tag">Mission ${state.step+1} sur 6 · ${escapeHTML(t.time)} · ${escapeHTML(t.skill)}</p><h2>${escapeHTML(t.title)}</h2><div class="task"><strong>À faire sur l’ordinateur</strong><p>${escapeHTML(t.instruction)}</p></div><button class="secondary" id="hint">Afficher un indice</button><div id="hintText" class="task hidden"></div><label class="check"><input type="checkbox" id="proof"> ${escapeHTML(t.proof)}</label><h3>Question de vérification</h3><p>${escapeHTML(t.q)}</p><div class="answers">${t.options.map((o,i)=>`<label><input type="radio" name="answer" value="${i}"> ${escapeHTML(o)}</label>`).join('')}</div><button id="verify">Vérifier ma réponse</button><div id="feedback" role="status"></div><button class="hidden" id="next">${state.step===5?'Terminer le parcours':'Mission suivante →'}</button><p class="muted small">Une mauvaise réponse n’empêche pas de réessayer.</p>`;el('hint').onclick=()=>{el('hintText').textContent=t.hint;el('hintText').classList.toggle('hidden')};el('verify').onclick=()=>{const chosen=document.querySelector('input[name=answer]:checked');if(!el('proof').checked){el('feedback').innerHTML='<div class="feedback bad">Effectuer la manipulation, puis cocher la case de confirmation.</div>';return}if(!chosen){el('feedback').innerHTML='<div class="feedback bad">Choisir une réponse avant de vérifier.</div>';return}state.attempts[state.step]=(state.attempts[state.step]||0)+1;save();if(Number(chosen.value)===t.answer){el('feedback').innerHTML='<div class="feedback ok">Bonne réponse ! '+escapeHTML(t.explain)+'</div>';el('next').classList.remove('hidden');el('verify').disabled=true;document.querySelectorAll('input[name=answer]').forEach(x=>x.disabled=true);el('proof').disabled=true}else{el('feedback').innerHTML='<div class="feedback bad">Ce n’est pas la bonne réponse. Relire la consigne ou afficher l’indice, puis réessayer.</div>'}};el('next').onclick=()=>{state.done.push(state.step);state.step++;save();render();window.scrollTo(0,0)}}function download(){const lines=['BILAN — MISSION NUMÉRIQUE 5e','Date : '+new Date().toLocaleDateString('fr-FR'),'Missions validées : '+state.done.length+'/6','',...tasks.map((t,i)=>`${i+1}. ${t.title} : ${state.done.includes(i)?'validée':'non validée'} — ${state.attempts[i]||0} tentative(s) au QCM`),'','Les manipulations sur l’ordinateur ont été déclarées par l’élève et non vérifiées automatiquement.'];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bilan_informatique_5e.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function reset(){if(confirm('Effacer la progression de ce navigateur et recommencer ?')){state={step:0,done:[],attempts:Array(6).fill(0)};save();render()}}render();
</script></body></html>
