<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission numérique 5e — parcours approfondi</title><style>
:root{font-family:Arial,Helvetica,sans-serif;background:#f2f5fa;color:#1b2c43}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:18px}header{background:#172e52;color:white;padding:24px;border-radius:16px}h1{margin:0 0 10px}h2{margin-top:0}.panel{background:white;padding:26px;border-radius:16px;margin-top:16px;box-shadow:0 2px 14px #1232}.progress{height:12px;background:#50627d;border-radius:20px;margin:18px 0 10px;overflow:hidden}.bar{height:100%;background:#62d4ac;transition:width .2s}.steps{display:flex;gap:7px;flex-wrap:wrap}.steps span{padding:6px 9px;border-radius:20px;background:#314a70;font-size:13px}.steps .active{background:#d4f4e7;color:#153c34}.task{background:#eef4ff;border-left:5px solid #356cb5;padding:16px;border-radius:8px;line-height:1.55}.scenario{background:#fff6e8;padding:14px;border-radius:8px;line-height:1.6}button{border:0;background:#205fb2;color:white;padding:12px 18px;border-radius:9px;font-size:16px;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#e6edf6;color:#1e385c}button:disabled{opacity:.45;cursor:not-allowed}.question{border-top:1px solid #d8e0eb;margin-top:22px;padding-top:14px}.options{display:grid;gap:8px}.options label{padding:11px;border:1px solid #cbd6e4;border-radius:9px;cursor:pointer}.options label:has(input:checked){background:#edf4ff;border-color:#3974c0}.feedback{padding:10px;margin:10px 0;border-radius:8px}.ok{background:#def4e8;color:#17583d}.bad{background:#fff0e8;color:#8b391d}.muted{color:#52657c}.hidden{display:none}textarea,input[type=text]{font:inherit;width:100%;padding:12px;border:1px solid #aebed1;border-radius:9px}textarea{min-height:130px;line-height:1.5}label.check{display:block;margin:15px 0}.pill{font-weight:bold;color:#315d98}.call{border:3px solid #226e57;background:#e5f7ed;border-radius:12px;padding:20px;font-size:22px;font-weight:bold;text-align:center}.score{font-size:24px;font-weight:bold}.bonus{background:#f6f0ff;padding:17px;border-radius:10px}footer{text-align:center;color:#617084;padding:18px}.printonly{display:none}@media(max-width:650px){.wrap{padding:8px}.panel{padding:16px}h1{font-size:23px}}@media print{header,footer,button,.noprint{display:none!important}.panel{box-shadow:none}.printonly{display:block}}
</style></head><body><div class="wrap"><header><h1>Mission numérique — 5e</h1><div>Enquête sur Internet, les fausses informations et les réseaux sociaux · Environ 50 minutes</div><div class="progress"><div class="bar" id="bar"></div></div><div class="steps" id="steps"></div></header><main class="panel" id="app"></main><footer>Les résultats restent sur cet ordinateur. Aucune donnée n’est envoyée au professeur ni à un serveur.</footer></div><script>
const missions=[{"title": "Organiser son espace de travail", "time": "7 min", "instruction": "Créer dans son espace personnel un dossier Informatique_5e, puis deux sous-dossiers : Documents et Images. Ouvrir Documents et vérifier son emplacement.", "hint": "Ouvrir le gestionnaire de fichiers. Clic droit → Nouveau dossier. Ne pas créer le dossier uniquement dans Téléchargements.", "questions": [{"q": "Pourquoi créer des sous-dossiers ?", "options": ["Pour ranger et retrouver ses fichiers", "Pour accélérer Internet", "Pour supprimer les documents"], "answer": 0, "explain": "Une organisation claire facilite la recherche."}, {"q": "Quel nom est le plus explicite ?", "options": ["Sans titre 2", "Affiche_securite_5e", "Nouveau document"], "answer": 1, "explain": "Un nom précis indique le contenu."}, {"q": "Après avoir téléchargé une image, où la ranger ?", "options": ["Dans le dossier Images", "Dans la corbeille", "Au hasard sur le bureau"], "answer": 0, "explain": "Le dossier Images est prévu pour cela."}]}, {"title": "Naviguer et rechercher", "time": "7 min", "instruction": "Ouvrir un deuxième onglet avec Ctrl + T. Rechercher « CNIL protéger ses données » et repérer un conseil sur le site officiel cnil.fr. Revenir ensuite à cette page.", "hint": "Ctrl + T ouvre un onglet. Un site officiel peut être identifié par son domaine et par l’organisme qui le publie.", "questions": [{"q": "Que fait Ctrl + T ?", "options": ["Ferme le navigateur", "Ouvre un onglet", "Efface l’historique"], "answer": 1, "explain": "Ce raccourci ouvre un nouvel onglet."}, {"q": "Quelle adresse correspond à la CNIL ?", "options": ["cnil.fr", "cnil-cadeaux.example", "securite-promo.example"], "answer": 0, "explain": "cnil.fr est le domaine officiel de la CNIL."}, {"q": "Pourquoi consulter plusieurs sources ?", "options": ["Pour confirmer une information", "Pour obtenir plus de publicités", "Pour éviter de lire"], "answer": 0, "explain": "Croiser les sources limite les erreurs."}]}, {"title": "Démasquer les fausses informations", "time": "9 min", "instruction": "Lire les trois situations ci-dessous. Pour chacune, noter dans le champ de réflexion ce que l’on vérifierait avant de partager. Les exemples sont inventés pour l’exercice.", "hint": "Chercher l’auteur, la date, la source d’origine et une confirmation indépendante. Une photo peut être ancienne ou sortie de son contexte.", "questions": [{"q": "Un message affirme : « Demain, tous les collèges ferment ! » sans source. Que faire ?", "options": ["Le partager immédiatement", "Vérifier sur les canaux officiels", "Le croire car il est très partagé"], "answer": 1, "explain": "Le nombre de partages ne prouve rien."}, {"q": "Une photo spectaculaire circule sans date. Quel est le risque ?", "options": ["Elle peut être ancienne ou sortie de son contexte", "Elle est forcément récente", "Une photo ne peut jamais tromper"], "answer": 0, "explain": "Une image authentique peut illustrer une affirmation fausse."}, {"q": "Un article contient un titre choquant mais aucune source identifiable. Quelle attitude adopter ?", "options": ["Vérifier ailleurs avant de croire ou partager", "Partager pour demander l’avis des autres", "Croire le titre sans lire"], "answer": 0, "explain": "Il faut rechercher des preuves indépendantes."}]}, {"title": "Réseaux sociaux : faire les bons choix", "time": "9 min", "instruction": "Lire les situations : A. Un camarade publie une photo de groupe sans demander l’accord. B. Un compte inconnu demande ton adresse et ton collège. C. Un groupe se moque régulièrement d’un élève. Dans le champ de réflexion, expliquer comment réagir à deux de ces situations.", "hint": "Demander le consentement avant de publier une photo, ne pas divulguer ses données et demander de l’aide à un adulte de confiance en cas de harcèlement.", "questions": [{"q": "Avant de publier une photo d’un camarade, il faut…", "options": ["Demander son accord", "Publier si la photo est drôle", "Le prévenir seulement après"], "answer": 0, "explain": "Respecter le droit à l’image et la vie privée."}, {"q": "Un inconnu demande ton adresse et tes horaires. Tu…", "options": ["Les donnes si son profil semble sympathique", "Ne les communiques pas et signales si nécessaire", "Les publies en commentaire"], "answer": 1, "explain": "Les informations personnelles ne doivent pas être communiquées à un inconnu."}, {"q": "Tu observes des moqueries répétées dans un groupe. Tu…", "options": ["Conserves des preuves et en parles à un adulte", "Partages les moqueries", "Ne fais rien car c’est en ligne"], "answer": 0, "explain": "Signaler et chercher de l’aide est une réponse adaptée."}, {"q": "Un compte très populaire affirme une information. Est-elle nécessairement vraie ?", "options": ["Oui, car il a beaucoup d’abonnés", "Non, il faut vérifier les preuves", "Oui, si la vidéo est bien montée"], "answer": 1, "explain": "La popularité n’est pas une preuve."}]}, {"title": "Créer un document argumenté", "time": "13 min", "instruction": "Ouvrir LibreOffice Writer ou Word. Créer un document intitulé « Mon guide pour un Internet responsable ». Ajouter trois parties : 1. Vérifier une information ; 2. Respecter les autres sur les réseaux ; 3. Protéger ses données. Dans chaque partie, rédiger au moins deux conseils complets, avec un exemple concret. Mettre en forme les titres, puis enregistrer dans Informatique_5e/Documents sous le nom Guide_Internet_NOM.", "hint": "Écrire des phrases personnelles, pas seulement copier des mots. Sélectionner un titre puis choisir Gras et une taille plus grande. Ctrl + S pour enregistrer.", "questions": [{"q": "Quel document répond à la consigne ?", "options": ["Un titre et six conseils expliqués", "Une seule phrase sans titre", "Une image sans texte"], "answer": 0, "explain": "Il faut au moins six conseils organisés."}, {"q": "Comment enregistrer régulièrement ?", "options": ["Ctrl + S", "Ctrl + P", "Ctrl + Z"], "answer": 0, "explain": "Ctrl + S enregistre le travail."}, {"q": "Quelle formulation est la plus utile ?", "options": ["Fais attention", "Avant de partager une nouvelle, vérifie son auteur et sa date", "Internet est compliqué"], "answer": 1, "explain": "Un conseil précis indique quoi faire."}]}, {"title": "Vérification et défi final", "time": "5 min", "instruction": "Retrouver le fichier Guide_Internet_NOM, le rouvrir et vérifier qu’il contient bien les trois parties et six conseils. Corriger les fautes et enregistrer. Répondre aux dernières questions.", "hint": "Utiliser le gestionnaire de fichiers, ouvrir Informatique_5e puis Documents. Pour corriger, ouvrir le fichier et enregistrer à nouveau.", "questions": [{"q": "Quel est le meilleur moyen de vérifier l’enregistrement ?", "options": ["Fermer sans regarder", "Retrouver et rouvrir le fichier", "Créer un nouveau dossier vide"], "answer": 1, "explain": "Rouvrir le document permet de contrôler sa présence."}, {"q": "Si une information semble douteuse, quelle méthode est la meilleure ?", "options": ["Chercher l’auteur, la date et d’autres sources", "Se fier au nombre de vues", "La partager avec un point d’interrogation"], "answer": 0, "explain": "Une vérification exige des sources fiables."}, {"q": "Que faire après une erreur dans un document ?", "options": ["Corriger puis enregistrer", "Supprimer tout le travail", "Ignorer l’erreur"], "answer": 0, "explain": "Corriger puis sauvegarder."}]}];
const KEY='mission_numerique_5e_v2';const total=missions.reduce((n,m)=>n+m.questions.length,0);
const initial=()=>({step:0,answers:{},attempts:{},first:{},notes:{},proof:{},bonus:'',finished:false});let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s||!Number.isInteger(s.step)||s.step<0||s.step>missions.length)s=initial();for(const k of ['answers','attempts','first','notes','proof'])if(!s[k])s[k]={};
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
function score(){return Object.values(s.first).filter(Boolean).length}function verified(){return Object.keys(s.answers).filter(k=>s.answers[k]===true).length}
function render(){ $('bar').style.width=(s.step/missions.length*100)+'%';$('steps').innerHTML=missions.map((m,i)=>`<span class="${i===s.step?'active':''}">${i<s.step?'✓ ':''}Mission ${i+1}</span>`).join('');if(s.step===missions.length){end();return}const m=missions[s.step],idx=s.step;let html=`<p class="pill">Mission ${idx+1}/6 · ${esc(m.time)}</p><h2>${esc(m.title)}</h2><div class="task"><strong>Travail à réaliser</strong><p>${esc(m.instruction)}</p></div><button class="secondary" id="hint">Afficher une aide</button><div class="task hidden" id="hintbox">${esc(m.hint)}</div>`;
if(idx===2)html+=`<div class="scenario"><strong>Trois exemples fictifs :</strong><p>1. « Tous les collèges seront fermés demain ! » (aucune source citée).</p><p>2. Une photographie d’une inondation est présentée comme datant d’aujourd’hui, sans date ni lieu.</p><p>3. « Partage cette publication à 10 amis pour gagner un téléphone ! »</p></div>`;
if(idx===3)html+=`<div class="scenario"><strong>Situations à analyser :</strong><p>A. Une photo de groupe est publiée sans demander l’avis des personnes.</p><p>B. Un inconnu demande ton adresse et tes horaires.</p><p>C. Des moqueries répétées visent un camarade dans une conversation de groupe.</p></div>`;
if(idx===2||idx===3){html+=`<h3>Réponse personnelle</h3><p>${idx===2?'Choisir deux exemples et expliquer, pour chacun, comment vérifier ou réagir (au moins 4 phrases au total).':'Choisir deux situations et expliquer précisément ce que tu ferais (au moins 4 phrases au total).'}</p><textarea id="note" placeholder="Écrire ici une réflexion personnelle…">${esc(s.notes[idx]||'')}</textarea><p class="muted">Cette réponse n’est pas corrigée automatiquement : le professeur pourra la lire à la fin.</p>`}
if(idx===4)html+=`<div class="scenario"><strong>Exigences du document :</strong><p>Un titre, trois sous-titres, au moins six conseils rédigés en phrases complètes et un exemple concret par partie. Utiliser une mise en page lisible. Enregistrer le fichier.</p></div>`;
html+=`<label class="check"><input type="checkbox" id="proof" ${s.proof[idx]?'checked':''}> Je confirme avoir effectué la manipulation ou le travail demandé.</label><h3>Questions de vérification</h3>`;
m.questions.forEach((q,j)=>{const key=idx+'-'+j,ok=s.answers[key]===true;html+=`<div class="question"><strong>${j+1}. ${esc(q.q)}</strong><div class="options">${q.options.map((o,k)=>`<label><input type="radio" name="q${j}" value="${k}" ${ok?'disabled':''}> ${esc(o)}</label>`).join('')}</div><button data-check="${j}" ${ok?'disabled':''}>${ok?'Réponse validée':'Vérifier cette réponse'}</button><div id="fb${j}" aria-live="polite">${ok?`<div class="feedback ok">Bonne réponse. ${esc(q.explain)}</div>`:''}</div></div>`});html+=`<p class="muted">Une erreur permet de réessayer, mais seule la première tentative compte dans le score.</p><button id="next">${idx===5?'Afficher mon bilan':'Passer à la mission suivante'}</button><div id="nextmsg" aria-live="polite"></div>`;$('app').innerHTML=html;
$('hint').onclick=()=>$('hintbox').classList.toggle('hidden');if($('note'))$('note').oninput=e=>{s.notes[idx]=e.target.value;save()};$('proof').onchange=e=>{s.proof[idx]=e.target.checked;save()};document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.check),q=m.questions[j],key=idx+'-'+j,chosen=document.querySelector(`input[name=q${j}]:checked`);if(!chosen){$('fb'+j).innerHTML='<div class="feedback bad">Choisir une réponse.</div>';return}const correct=Number(chosen.value)===q.answer;s.attempts[key]=(s.attempts[key]||0)+1;if(s.attempts[key]===1)s.first[key]=correct;if(correct){s.answers[key]=true;b.disabled=true;document.querySelectorAll(`input[name=q${j}]`).forEach(x=>x.disabled=true);$('fb'+j).innerHTML=`<div class="feedback ok">Bonne réponse. ${esc(q.explain)}</div>`}else $('fb'+j).innerHTML='<div class="feedback bad">Ce n’est pas la bonne réponse. Relire, réfléchir puis réessayer.</div>';save()});$('next').onclick=()=>{const all=m.questions.every((q,j)=>s.answers[idx+'-'+j]===true),noteNeeded=(idx===2||idx===3),noteOk=!noteNeeded||(s.notes[idx]||'').trim().length>=90;if(!s.proof[idx]||!all||!noteOk){$('nextmsg').innerHTML='<div class="feedback bad">Pour avancer : terminer la manipulation, valider toutes les réponses et, si demandé, rédiger une réponse personnelle d’au moins 90 caractères.</div>';return}s.step++;save();render();window.scrollTo(0,0)}}
function end(){const scoreText=`${score()} / ${total}`;const attempts=Object.values(s.attempts).reduce((a,b)=>a+b,0);$('bar').style.width='100%';$('app').innerHTML=`<h2>Bilan de la séance</h2><p class="score">Score au premier essai : ${scoreText}</p><p>Questions finalement validées : ${verified()} / ${total} · Tentatives au total : ${attempts}</p><p>Missions terminées : 6 / 6</p><div class="call">Travail terminé : appeler le professeur pour vérification.</div><h3>Présenter au professeur</h3><p>1. Le document <strong>Guide_Internet_NOM</strong> ouvert dans le traitement de texte.</p><p>2. Le dossier <strong>Informatique_5e/Documents</strong>.</p><p>3. Cet écran de bilan, avec le score et les réponses personnelles.</p><h3>Mes réponses personnelles</h3><p><strong>Fausses informations :</strong></p><div class="task">${esc(s.notes[2]||'Aucune réponse')}</div><p><strong>Réseaux sociaux :</strong></p><div class="task">${esc(s.notes[3]||'Aucune réponse')}</div><div class="bonus"><h3>Défi bonus — pour les élèves rapides (10 à 15 min)</h3><p>Ajouter au document une quatrième partie intitulée « Avant de partager, je réfléchis ». Inventer une fausse information plausible mais clairement signalée comme fictive, puis expliquer en cinq phrases comment un élève pourrait vérifier qu’elle est fausse. Ajouter ensuite un encadré « Mes trois réflexes essentiels ».</p><p>Ne publier ni partager cette fausse information : elle sert uniquement à l’exercice.</p><label class="check"><input type="checkbox" id="bonusdone" ${s.bonusDone?'checked':''}> J’ai réalisé le défi bonus dans mon document.</label></div><button id="print">Imprimer / enregistrer le bilan en PDF</button><button class="secondary" id="download">Télécharger le bilan texte</button><button class="secondary" id="restart">Recommencer à zéro</button><p class="muted">Le score porte sur les QCM. Les productions et manipulations doivent être vérifiées par le professeur.</p>`;$('bonusdone').onchange=e=>{s.bonusDone=e.target.checked;save()};$('print').onclick=()=>window.print();$('download').onclick=download;$('restart').onclick=()=>{if(confirm('Effacer les résultats et recommencer ?')){s=initial();save();render()}}}
function download(){const lines=['MISSION NUMÉRIQUE 5e — BILAN','Date : '+new Date().toLocaleDateString('fr-FR'),`Score au premier essai : ${score()}/${total}`,`Réponses validées : ${verified()}/${total}`,'Tentatives : '+Object.values(s.attempts).reduce((a,b)=>a+b,0),'','Réflexion sur les fausses informations :',s.notes[2]||'','', 'Réflexion sur les réseaux sociaux :',s.notes[3]||'','', 'Production LibreOffice : à vérifier par le professeur.'];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bilan_informatique_5e.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>
